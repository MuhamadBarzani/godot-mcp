<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Background circle (MCP-style node) -->
  <circle cx="64" cy="64" r="60" fill="#1e1e2e" stroke="#4a9eff" stroke-width="2"/>

  <!-- Godot robot head silhouette (simplified) -->
  <!-- Head shape: rounded top, flat-ish bottom, ear bumps -->
  <path d="M 44 38 Q 44 30 52 30 L 76 30 Q 84 30 84 38 L 84 72 Q 84 80 76 80 L 68 80 L 64 86 L 60 80 L 52 80 Q 44 80 44 72 Z"
        fill="#4a9eff" opacity="0.9"/>

  <!-- Eyes (Godot's signature white eyes) -->
  <circle cx="56" cy="52" r="6" fill="#1e1e2e"/>
  <circle cx="72" cy="52" r="6" fill="#1e1e2e"/>
  <!-- Eye highlights -->
  <circle cx="54" cy="50" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="70" cy="50" r="2" fill="#ffffff" opacity="0.8"/>

  <!-- Mouth area (subtle grid pattern = "code"/"connection") -->
  <rect x="52" y="62" width="24" height="4" rx="2" fill="#1e1e2e" opacity="0.6"/>

  <!-- MCP connection lines ( emanating from head = "plugging into the protocol") -->
  <!-- Left connection -->
  <line x1="44" y1="50" x2="20" y2="50" stroke="#4aff9e" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="16" cy="50" r="4" fill="#4aff9e"/>

  <!-- Right connection -->
  <line x1="84" y1="50" x2="108" y2="50" stroke="#4aff9e" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="112" cy="50" r="4" fill="#4aff9e"/>

  <!-- Bottom connection (bridge/transport) -->
  <line x1="64" y1="86" x2="64" y2="108" stroke="#4aff9e" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="64" cy="112" r="4" fill="#4aff9e"/>

  <!-- Small "MCP" label dots on the connections -->
  <circle cx="16" cy="50" r="1.5" fill="#1e1e2e"/>
  <circle cx="112" cy="50" r="1.5" fill="#1e1e2e"/>
  <circle cx="64" cy="112" r="1.5" fill="#1e1e2e"/>
</svg>